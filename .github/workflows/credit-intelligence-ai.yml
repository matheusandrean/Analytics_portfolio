name: Credit Intelligence AI CI

on:
  push:
    branches: [main]
    paths:
      - 'projects/credit-intelligence-ai/**'
      - '.github/workflows/credit-intelligence-ai.yml'
  pull_request:
    branches: [main]
    paths:
      - 'projects/credit-intelligence-ai/**'
      - '.github/workflows/credit-intelligence-ai.yml'

permissions:
  contents: read

defaults:
  run:
    working-directory: projects/credit-intelligence-ai

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: projects/credit-intelligence-ai/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (black)
        run: black --check .

      - name: Type check (mypy)
        run: mypy src api || true # non-blocking during early-stage typing rollout

      - name: Secret scan (detect-secrets vs baseline)
        run: |
          # Fails only on secrets NOT already reviewed in .secrets.baseline
          # (that baseline's existing entries are false positives - notebook
          # base64 chart images and a documentation string listing patterns
          # to search for - see SECURITY.md).
          detect-secrets-hook --baseline .secrets.baseline $(git ls-files)

      - name: Dependency vulnerability scan (pip-audit)
        run: pip-audit --skip-editable || true # advisory, non-blocking

      - name: Generate synthetic dataset (small sample for CI)
        run: |
          python -c "
          from src.data.generate_synthetic_credit_data import GenerationConfig, generate_customer_snapshot
          cfg = GenerationConfig(n_customers=2000, random_seed=42, start_date='2023-01-01', end_date='2025-06-30')
          df = generate_customer_snapshot(cfg)
          print(df.shape)
          "

      - name: Run tests with coverage
        run: pytest --cov=src --cov=api --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: projects/credit-intelligence-ai/coverage.xml

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image (no push)
        uses: docker/build-push-action@v6
        with:
          context: projects/credit-intelligence-ai
          target: api
          push: false
          tags: credit-intelligence-ai:api-ci
